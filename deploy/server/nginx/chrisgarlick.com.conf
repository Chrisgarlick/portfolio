# chrisgarlick.com on Laravel. Plan section 9.3.
#
# Replaces /etc/nginx/sites-available/chrisgarlick.com at cutover. Keeps the
# live TLS, the www redirect and the security headers; swaps the static root
# and the Node proxies for the page cache and PHP-FPM.
#
# Rollback in under 30 seconds: restore the previous file (provision.sh saves
# it as chrisgarlick.com.kritano), `nginx -t && systemctl reload nginx`. The
# old static site in /var/www/chrisgarlick/dist/client is untouched.

server {
    listen 80;
    server_name chrisgarlick.com www.chrisgarlick.com;
    return 301 https://chrisgarlick.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.chrisgarlick.com;
    ssl_certificate /etc/letsencrypt/live/chrisgarlick.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chrisgarlick.com/privkey.pem;
    return 301 https://chrisgarlick.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name chrisgarlick.com;

    ssl_certificate /etc/letsencrypt/live/chrisgarlick.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chrisgarlick.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    server_tokens off;

    root /var/www/site/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 25M;

    # Security headers, as live. The CSP drops fonts.googleapis.com and
    # fonts.gstatic.com: fonts are now self-hosted. script-src keeps
    # 'unsafe-inline' for parity; tightening it to hashes is noted in the plan.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-src 'self' https://www.googletagmanager.com; frame-ancestors 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;
    # The page cache writes .gz siblings at write time.
    gzip_static on;

    # Page cache: cookie-free GETs are served from disk with no PHP at all.
    # The admin session cookie, a query string or a non-GET goes to PHP.
    set $cacheable 1;
    if ($request_method != GET) { set $cacheable 0; }
    if ($http_cookie ~* "session") { set $cacheable 0; }
    if ($args != "") { set $cacheable 0; }

    location / {
        if ($cacheable = 1) {
            rewrite ^ /__cached$uri last;
        }
        try_files $uri @php;
    }

    location ^~ /__cached/ {
        internal;
        rewrite ^/__cached(.*)$ $1 break;
        try_files /page-cache$1/index.html /page-cache$1.html $1 @php;
    }

    # Media variants: disk first, PHP generates on a miss and writes the file.
    # Not immutable: moving a focal point changes the pixels behind a URL.
    location /media/ {
        try_files $uri @php;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Hashed build output: the site's assets and the admin bundle.
    location ~ ^/(build|vendor/cg-cms)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; try_files $uri =404; }
    location = /robots.txt  { access_log off; try_files $uri @php; }

    location @php {
        fastcgi_pass unix:/run/php/site.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}
