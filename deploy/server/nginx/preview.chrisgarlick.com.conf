# preview.chrisgarlick.com: client design previews (Design's client-previews.md, step 5).
#
# Every request goes to Laravel, where ServePreviewHost answers it with the
# preview gate before routing: the sign-in pages, and the files of a
# signed-in client's preview. The gate sends a file by X-Accel-Redirect to
# /_previews/, which only it can reach (`internal`); nginx then serves it
# from storage/previews/<slug>/current/ without PHP.
#
# Not on the stats IP lock: clients must get in. The snippet is included so
# it can be locked from the stats Access page in an emergency, but leave this
# host unlocked.
#
# Install (as root, once DNS points here):
#   certbot certonly --nginx -d preview.chrisgarlick.com
#   cp preview.chrisgarlick.com.conf /etc/nginx/sites-available/
#   ln -s ../sites-available/preview.chrisgarlick.com.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# and PREVIEW_ACCEL=true in /var/www/site/.env, then php artisan config:cache.

# Password attempts: the gate allows 10 per 10 minutes per IP as well.
limit_req_zone $binary_remote_addr zone=preview_login:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name preview.chrisgarlick.com;
    include /etc/nginx/snippets/stats-access.conf;   # stats: IP allowlist (Access page)
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://preview.chrisgarlick.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name preview.chrisgarlick.com;
    include /etc/nginx/snippets/stats-access.conf;   # stats: IP allowlist (Access page)

    ssl_certificate /etc/letsencrypt/live/preview.chrisgarlick.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview.chrisgarlick.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    root /var/www/site/public;
    charset utf-8;
    client_max_body_size 16k;   # only the password form posts here
    access_log /var/log/nginx/preview.access.log;

    # The gate sets X-Robots-Tag, Referrer-Policy, the CSP and nosniff on
    # everything it answers. These cover what nginx answers itself.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;

    # Files the gate has let through. Never reachable from outside.
    location /_previews/ {
        internal;
        alias /var/www/site/storage/previews/;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'" always;
    }

    location ~ ^/[a-z0-9-]+/login$ {
        limit_req zone=preview_login burst=5 nodelay;
        limit_req_status 429;
        try_files /nonexistent @php;
    }

    # Everything else, robots.txt included, is the gate's: nothing is served
    # from public/ on this host.
    location / {
        try_files /nonexistent @php;
    }

    location @php {
        fastcgi_pass 127.0.0.1:9083;  # site-php container (/opt/site-php)
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 30s;
    }
}
