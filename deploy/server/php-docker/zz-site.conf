; The site's pool, overriding the image's default [www] pool. Same settings
; as php/site.conf, but listening on loopback TCP: the container shares the
; host's network, so nginx and Postgres stay on 127.0.0.1.
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9083

pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 300

php_admin_value[memory_limit] = 128M
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 25M
php_admin_value[expose_php] = Off
