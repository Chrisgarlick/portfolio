; PHP-FPM pool for chrisgarlick.com. Plan section 9.2, 1GB column.
;
; ondemand with four children: nginx serves almost every request from the page
; cache, so PHP only handles cold renders, form posts and the admin. Idle
; workers exit after 10s, so the box carries no PHP memory when nobody is
; editing and nothing is cold.

[site]
user = www-data
group = www-data
listen = /run/php/site.sock
listen.owner = www-data
listen.group = www-data

pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 300

php_admin_value[memory_limit] = 128M
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 25M
php_admin_value[expose_php] = Off
